name: Secure Encryption

on: [push] # Or any other trigger event

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          # Add any required libraries here
          # pip install ...

      - name: Run encryption script
        env:
          ENCRYPTION_KEY: ${{ secrets.CHACHA_KEY }}
          ENCRYPTION_NONCE: ${{ secrets.CHACHA_NONCE }}
        run: python chacha_encrypt.py /test folder # Replace with the actual path