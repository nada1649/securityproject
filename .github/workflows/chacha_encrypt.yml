name: Secure Encryption

on:
  workflow_dispatch: # allows manual trigger

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          # Add any required libraries here
          # pip install ...

      - name: Debug env presence
        run: |
          if [ -z "$CHACHA_KEY" ]; then echo "CHACHA_KEY is missing"; else echo "CHACHA_KEY is present"; fi
          if [ -z "$CHACHA_NONCE" ]; then echo "CHACHA_NONCE is missing"; else echo "CHACHA_NONCE is present"; fi
        env:
          CHACHA_KEY: ${{ secrets.CHACHA_KEY }}
          CHACHA_NONCE: ${{ secrets.CHACHA_NONCE }}

      - name: Run encryption script
        env:
          CHACHA_KEY: ${{ secrets.CHACHA_KEY }}
          CHACHA_NONCE: ${{ secrets.CHACHA_NONCE }}
        run: |
          python chacha_encrypt.py
