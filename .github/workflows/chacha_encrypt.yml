name: Secure Encryption

on:
  workflow_dispatch: # allows manual trigger

jobs:
  encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required libraries here if necessary

      - name: Run encryption script
        env:
          CHACHA_KEY: ${{ secrets.CHACHA_KEY }}
          CHACHA_NONCE: ${{ secrets.CHACHA_NONCE }}
        run: |
          python chacha_encrypt.py

      - name: Debug - list contents of test folder
        run: |
          echo "Listing contents of test folder after encryption:"
          ls -al "./test folder"

      - name: Upload encrypted files as artifact
        uses: actions/upload-artifact@v2
        with:
          name: encrypted-files
          path: ./test\ folder/*.encrypted
