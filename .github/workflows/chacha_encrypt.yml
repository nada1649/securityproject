name: Secure Encryption

on:
  workflow_dispatch: # allows manual trigger

jobs:
  encrypt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required libraries here if necessary

      - name: Run encryption script
        env:
          CHACHA_KEY: ${{ secrets.CHACHA_KEY }}
          CHACHA_NONCE: ${{ secrets.CHACHA_NONCE }}
        run: |
          python chacha_encrypt.py  # Make sure it encrypts files in a directory like "test folder"

      - name: Upload encrypted files as artifact
        uses: actions/upload-artifact@v3
        with:
          name: encrypted-files
          path: ./test\ folder/*.encrypted # Path to the encrypted files in your project
